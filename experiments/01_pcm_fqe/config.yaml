  grid_size: 61
  samples_per_lambda: 16
  diagnostic_lambdas:
    - [0.0, 0.0]
    - [0.25, 0.0]
    - [-0.25, 0.0]
    - [0.0, 0.25]
    - [0.50, 0.20]

output_dir: results/01_pcm_fqe
