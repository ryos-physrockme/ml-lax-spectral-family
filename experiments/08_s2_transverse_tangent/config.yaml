seed: 1234

input_trace: results/06_s2_pseudo_arclength_continuation/trace.json

sampling:
  flatness_samples: 768
  evaluation_flatness_samples: 1536
  jacobian_samples: 4096
  theta_margin: 0.35
  denominator_epsilon: 1.0e-10

network:
  hidden_dim: 192
  hidden_layers: 3

chart_domain:
  transverse_min: -0.75
  transverse_max: 0.75
  evaluation_s_points: 81
  evaluation_t_points: 31

anchors:
  n_points: 96
  batch_size: 48

training:
  steps: 5000
  latent_batch_size: 64
  learning_rate: 0.001
  log_every: 100
  flatness_weight: 1.0
  anchor_weight: 25.0
  derivative_norm_weight: 0.10
  barrier_epsilon: 1.0e-6

variants:
  - name: logarithmic_rank_barrier
    barrier_weight: 0.10
    frame_weight: 0.0
  - name: nullspace_tangent_frame
    barrier_weight: 0.02
    frame_weight: 5.0

output_dir: results/08_s2_transverse_tangent
