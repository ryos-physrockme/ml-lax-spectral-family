seed: 1234

domain:
  re_min: 0.5
  re_max: 1.5
  im_min: -0.5
  im_max: 0.5

training:
  steps: 4000
  batch_size: 4096
  learning_rate: 0.002
  hidden_dim: 128
  hidden_layers: 3
  log_every: 200
  history_every: 50

evaluation:
  grid_size: 61
  samples_per_lambda: 16
  diagnostic_lambdas:
    - [1.0, 0.0]
    - [0.75, 0.0]
    - [1.25, 0.0]
    - [1.0, 0.25]
    - [0.75, 0.25]

output_dir: results/02_s2_fqe
