name: experiment 04 - PCM spectral-parameter sampling ablation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'experiments/04_pcm_lambda_sampling_ablation/**'
      - 'experiments/03_pcm_loss_comparison/train.py'
      - 'experiments/03_pcm_loss_comparison/config.yaml'
      - 'src/ml_lax_spectral_family/models.py'
      - '.github/workflows/run-experiment-04.yml'

permissions:
  contents: write

jobs:
  sampling-ablation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install package and training dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[train,dev]'

      - name: Run unit tests
        run: pytest

      - name: Train all losses with a fixed spectral-parameter batch
        shell: bash
        run: |
          for method in plain analytic_weight normalized_adaptive; do
            python experiments/03_pcm_loss_comparison/train.py \
              --config experiments/03_pcm_loss_comparison/config.yaml \
              --method "$method" \
              --lambda-sampling fixed \
              --output-dir "results/04_pcm_lambda_sampling_ablation/fixed/$method" \
              --device cpu
          done

      - name: Train all losses with a resampled spectral-parameter batch
        shell: bash
        run: |
          for method in plain analytic_weight normalized_adaptive; do
            python experiments/03_pcm_loss_comparison/train.py \
              --config experiments/03_pcm_loss_comparison/config.yaml \
              --method "$method" \
              --lambda-sampling resampled \
              --output-dir "results/04_pcm_lambda_sampling_ablation/resampled/$method" \
              --device cpu
          done

      - name: Generate ablation figures
        run: |
          python experiments/04_pcm_lambda_sampling_ablation/plot_results.py \
            --results results/04_pcm_lambda_sampling_ablation \
            --output figures/04_pcm_lambda_sampling_ablation

      - name: Upload complete numerical output
        uses: actions/upload-artifact@v6
        with:
          name: experiment-04-pcm-lambda-sampling-ablation
          path: |
            results/04_pcm_lambda_sampling_ablation
            figures/04_pcm_lambda_sampling_ablation

      - name: Commit figures and numerical summary
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add figures/04_pcm_lambda_sampling_ablation
          if git diff --cached --quiet; then
            echo "Figures are unchanged."
          else
            git commit -m "Add spectral-parameter sampling ablation figures [skip ci]"
            git push
          fi
