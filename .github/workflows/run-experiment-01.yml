name: experiment 01 - principal chiral model F=QE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'experiments/01_pcm_fqe/**'
      - 'src/ml_lax_spectral_family/**'
      - 'pyproject.toml'
      - '.github/workflows/run-experiment-01.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install package and training dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[train,dev]'

      - name: Run analytic and numerical unit tests
        run: pytest

      - name: Train the unrestricted Q(lambda) network
        run: |
          python experiments/01_pcm_fqe/train.py \
            --config experiments/01_pcm_fqe/config.yaml \
            --device cpu

      - name: Generate validation figures
        run: |
          python experiments/01_pcm_fqe/plot_results.py \
            --results results/01_pcm_fqe \
            --output figures/01_pcm_fqe

      - name: Upload complete numerical output
        uses: actions/upload-artifact@v6
        with:
          name: experiment-01-pcm-fqe
          path: |
            results/01_pcm_fqe
            figures/01_pcm_fqe

      - name: Commit figures and numerical summary
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add figures/01_pcm_fqe
          if git diff --cached --quiet; then
            echo "Figures are unchanged."
          else
            git commit -m "Add experiment 01 validation figures [skip ci]"
            git push
          fi
