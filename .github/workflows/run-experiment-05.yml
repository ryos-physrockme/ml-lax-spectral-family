name: experiment 05 - S2 Jacobian family discovery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'experiments/05_s2_jacobian_family_discovery/**'
      - '.github/workflows/run-experiment-05.yml'

permissions:
  contents: write

jobs:
  discover-family:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install package and plotting dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[train,dev]'

      - name: Run unit tests
        run: pytest

      - name: Land random initializations and compute the flatness Jacobian
        run: |
          python experiments/05_s2_jacobian_family_discovery/train.py \
            --config experiments/05_s2_jacobian_family_discovery/config.yaml \
            --device cpu

      - name: Convert normalized-Jacobian null vectors back to coefficient coordinates
        run: |
          python experiments/05_s2_jacobian_family_discovery/reanalyze.py \
            --config experiments/05_s2_jacobian_family_discovery/config.yaml \
            --results results/05_s2_jacobian_family_discovery

      - name: Generate discovery figures
        run: |
          python experiments/05_s2_jacobian_family_discovery/plot_results.py \
            --results results/05_s2_jacobian_family_discovery \
            --output figures/05_s2_jacobian_family_discovery

      - name: Upload complete numerical output
        uses: actions/upload-artifact@v6
        with:
          name: experiment-05-s2-jacobian-family-discovery
          path: |
            results/05_s2_jacobian_family_discovery
            figures/05_s2_jacobian_family_discovery

      - name: Commit figures and numerical summary
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add figures/05_s2_jacobian_family_discovery
          if git diff --cached --quiet; then
            echo "Figures are unchanged."
          else
            git commit -m "Add S2 Jacobian family-discovery figures [skip ci]"
            git push
          fi
