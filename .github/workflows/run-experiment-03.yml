name: experiment 03 - PCM loss comparison

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'experiments/03_pcm_loss_comparison/**'
      - 'src/ml_lax_spectral_family/models.py'
      - '.github/workflows/run-experiment-03.yml'

permissions:
  contents: write

jobs:
  compare-losses:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install package and training dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[train,dev]'

      - name: Run unit tests
        run: pytest

      - name: Train with bare flatness loss
        run: |
          python experiments/03_pcm_loss_comparison/train.py \
            --config experiments/03_pcm_loss_comparison/config.yaml \
            --method plain --device cpu

      - name: Train with analytic spectral-parameter weighting
        run: |
          python experiments/03_pcm_loss_comparison/train.py \
            --config experiments/03_pcm_loss_comparison/config.yaml \
            --method analytic_weight --device cpu

      - name: Train with component normalization and adaptive weighting
        run: |
          python experiments/03_pcm_loss_comparison/train.py \
            --config experiments/03_pcm_loss_comparison/config.yaml \
            --method normalized_adaptive --device cpu

      - name: Generate comparison figures
        run: |
          python experiments/03_pcm_loss_comparison/plot_results.py \
            --results results/03_pcm_loss_comparison \
            --output figures/03_pcm_loss_comparison

      - name: Upload complete numerical output
        uses: actions/upload-artifact@v6
        with:
          name: experiment-03-pcm-loss-comparison
          path: |
            results/03_pcm_loss_comparison
            figures/03_pcm_loss_comparison

      - name: Commit figures and numerical summary
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add figures/03_pcm_loss_comparison
          if git diff --cached --quiet; then
            echo "Figures are unchanged."
          else
            git commit -m "Add PCM loss-comparison figures [skip ci]"
            git push
          fi
