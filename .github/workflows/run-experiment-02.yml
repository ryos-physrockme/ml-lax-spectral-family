name: experiment 02 - S2 off-shell factorization

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'experiments/02_s2_fqe/**'
      - 'src/ml_lax_spectral_family/s2.py'
      - 'src/ml_lax_spectral_family/models.py'
      - 'tests/test_s2_fqe.py'
      - '.github/workflows/run-experiment-02.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install package and training dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[train,dev]'

      - name: Run analytic and numerical unit tests
        run: pytest

      - name: Train the unrestricted 3 x 2 Q(lambda) network
        run: |
          python experiments/02_s2_fqe/train.py \
            --config experiments/02_s2_fqe/config.yaml \
            --device cpu

      - name: Generate validation figures
        run: |
          python experiments/02_s2_fqe/plot_results.py \
            --results results/02_s2_fqe \
            --output figures/02_s2_fqe

      - name: Upload complete numerical output
        uses: actions/upload-artifact@v6
        with:
          name: experiment-02-s2-fqe
          path: |
            results/02_s2_fqe
            figures/02_s2_fqe

      - name: Commit figures and numerical summary
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add figures/02_s2_fqe
          if git diff --cached --quiet; then
            echo "Figures are unchanged."
          else
            git commit -m "Add S2 F=QE validation figures [skip ci]"
            git push
          fi
