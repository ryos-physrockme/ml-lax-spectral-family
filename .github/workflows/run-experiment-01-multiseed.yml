name: experiment 01 multi-seed stability

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'experiments/01_pcm_fqe/run_multiseed.py'
      - 'experiments/01_pcm_fqe/aggregate_multiseed.py'
      - '.github/workflows/run-experiment-01-multiseed.yml'

permissions:
  contents: write

jobs:
  validate-multiseed:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install package and training dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[train,dev]'

      - name: Run analytic and numerical unit tests
        run: pytest

      - name: Train five independent networks
        run: |
          python experiments/01_pcm_fqe/run_multiseed.py \
            --config experiments/01_pcm_fqe/config.yaml \
            --output-root results/01_pcm_fqe_multiseed \
            --device cpu \
            --seeds 1234 2026 2718 31415 4242

      - name: Aggregate diagnostics and generate figures
        run: |
          python experiments/01_pcm_fqe/aggregate_multiseed.py \
            --root results/01_pcm_fqe_multiseed \
            --output figures/01_pcm_fqe_multiseed

      - name: Upload complete multi-seed output
        uses: actions/upload-artifact@v6
        with:
          name: experiment-01-pcm-fqe-multiseed
          path: |
            results/01_pcm_fqe_multiseed
            figures/01_pcm_fqe_multiseed

      - name: Commit multi-seed figures and summary
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add figures/01_pcm_fqe_multiseed
          if git diff --cached --quiet; then
            echo "Multi-seed figures are unchanged."
          else
            git commit -m "Add multi-seed PCM F=QE validation figures [skip ci]"
            git push
          fi
