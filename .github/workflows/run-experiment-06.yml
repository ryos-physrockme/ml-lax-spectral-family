name: experiment 06 - S2 pseudo-arclength continuation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'experiments/06_s2_pseudo_arclength_continuation/**'
      - 'figures/05_s2_jacobian_family_discovery/continuation_seed.json'
      - 'experiments/05_s2_jacobian_family_discovery/train.py'
      - '.github/workflows/run-experiment-06.yml'

permissions:
  contents: write

jobs:
  continue-family:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install package and plotting dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[train,dev]'

      - name: Run unit tests
        run: pytest

      - name: Trace the flat-connection family in both radial directions
        run: |
          python experiments/06_s2_pseudo_arclength_continuation/continue_family.py \
            --config experiments/06_s2_pseudo_arclength_continuation/config.yaml \
            --device cpu

      - name: Generate continuation figures
        run: |
          python experiments/06_s2_pseudo_arclength_continuation/plot_results.py \
            --results results/06_s2_pseudo_arclength_continuation \
            --output figures/06_s2_pseudo_arclength_continuation

      - name: Upload complete numerical output
        uses: actions/upload-artifact@v6
        with:
          name: experiment-06-s2-pseudo-arclength-continuation
          path: |
            results/06_s2_pseudo_arclength_continuation
            figures/06_s2_pseudo_arclength_continuation

      - name: Commit figures and numerical summary
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add figures/06_s2_pseudo_arclength_continuation
          if git diff --cached --quiet; then
            echo "Figures are unchanged."
          else
            git commit -m "Add S2 continuation figures [skip ci]"
            git push
          fi
