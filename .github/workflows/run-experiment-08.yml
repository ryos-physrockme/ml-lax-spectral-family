name: experiment 08 - S2 transverse tangent

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'experiments/08_s2_transverse_tangent/**'
      - 'experiments/07_s2_neural_chart/**'
      - 'experiments/06_s2_pseudo_arclength_continuation/**'
      - 'experiments/05_s2_jacobian_family_discovery/**'
      - 'figures/05_s2_jacobian_family_discovery/continuation_seed.json'
      - '.github/workflows/run-experiment-08.yml'

permissions:
  contents: write

jobs:
  recover-transverse-direction:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install package and plotting dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[train,dev]'

      - name: Run unit tests
        run: pytest

      - name: Regenerate the continuation path used as anchors
        run: |
          python experiments/06_s2_pseudo_arclength_continuation/continue_family.py \
            --config experiments/06_s2_pseudo_arclength_continuation/config.yaml \
            --device cpu

      - name: Train the transverse-direction variants
        run: |
          python experiments/08_s2_transverse_tangent/train.py \
            --config experiments/08_s2_transverse_tangent/config.yaml \
            --device cpu

      - name: Generate figures
        run: |
          python experiments/08_s2_transverse_tangent/plot_results.py \
            --results results/08_s2_transverse_tangent \
            --output figures/08_s2_transverse_tangent

      - name: Upload complete numerical output
        uses: actions/upload-artifact@v6
        with:
          name: experiment-08-s2-transverse-tangent
          path: |
            results/06_s2_pseudo_arclength_continuation
            results/08_s2_transverse_tangent
            figures/08_s2_transverse_tangent

      - name: Commit figures
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add figures/08_s2_transverse_tangent
          if git diff --cached --quiet; then
            echo "Figures are unchanged."
          else
            git commit -m "Add S2 transverse-tangent figures [skip ci]"
          fi
          git pull --rebase origin main
          git push
